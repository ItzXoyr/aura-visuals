name: Build mod jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Provides a working `gradle` command and caches dependencies,
      # so we don't need a committed gradlew wrapper at all.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --stacktrace

      - name: Upload compiled jar
        uses: actions/upload-artifact@v4
        with:
          name: aura-visuals-jar
          path: build/libs/*.jar

      # Optional: also attaches the jar to a GitHub Release when you push a tag like "v1.0.0".
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
